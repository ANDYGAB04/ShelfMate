<div class="container-fluid card login-container">
  <h3 class="text-center">Login</h3>
  <hr>
  @if (errorMsg.length) {
    <div class="alert alert-danger d-flex flex-column gap-1" role="alert">
      @for (msg of errorMsg; track $index) {
        <div>{{ msg }}</div>
      }
    </div>
  }
  <div class="mb-3">
    <label for="login" class="form-label">Email address</label>
    <input [(ngModel)]="authRequest.email" type="email" class="form-control" id="login" placeholder="name@example.com">
  </div>
  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input [(ngModel)]="authRequest.password" type="password" class="form-control" id="password"
           placeholder="Password">
  </div>
  <div class="d-flex justify-content-between mb-3">
    <button (click)="login()" type="button" class="btn btn-primary">
      <i class="fas fa-sign-in-alt"></i> Sign in
    </button>
    <div>
      Don't have an account?&nbsp;
      <button (click)="register()" type="button" class="btn btn-link">
        <i class="fas fa-sign-in-alt"></i> Sign in
      </button>
    </div>
  </div>
</div>
